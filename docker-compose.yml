---
networks:
  devops_net:
    driver: bridge
volumes:
  nginx_logs:
  nginx_html:
services:
  nginx:
    image: vladnemocr/nginx:v1.0.0
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: nginx_proxy
    ports: [80:80, 443:443]
    volumes: [nginx_logs:/var/log/nginx, nginx_html:/usr/share/nginx/html]
    networks: [devops_net]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    restart: unless-stopped
    healthcheck:
      test: [CMD, curl, -f, http://localhost/]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
  log_parser:
    image: vladnemocr/log_parser:v1.0.0
    build:
      context: ./log_parser
      dockerfile: Dockerfile
    container_name: nginx_log_parser
    volumes: [nginx_logs:/var/log/nginx, nginx_html:/usr/share/nginx/html]
    networks: [devops_net]
    restart: always
    depends_on:
      nginx:
        condition: service_healthy
  apache_php:
    image: vladnemocr/apache_php:v1.0.0
    build:
      context: ./apache
      dockerfile: Dockerfile
    container_name: apache_php
    networks: [devops_net]
    restart: unless-stopped
